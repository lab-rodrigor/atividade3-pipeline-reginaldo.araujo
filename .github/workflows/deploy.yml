name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: reginaldo-araujo
  PORTA: 23280

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker rm -f banco" || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker rm -f api" || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker rm -f front" || true

      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network create --internal net-db" || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network create net-api" || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker volume create pgdata" || true

      - name: Subir banco, API e front
        run: |
          # 1. Banco de Dados
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name banco --network net-db -v pgdata:/var/lib/postgresql/data -e POSTGRES_PASSWORD='${{ secrets.DB_SENHA }}' postgres:17-alpine"

          # 2. API
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name api --network net-db -e DB_HOST=banco -e DB_PASSWORD='${{ secrets.DB_SENHA }}' gr-atv2-api:1"
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network connect net-api api"

          # 3. Front-end
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name front --network net-api -p ${{ env.PORTA }}:80 -e API=api -e DEPLOY_SHA=${{ github.sha }} gr-atv2-front:1"

      - name: Conferir que subiu
        run: |
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://gr.lab.ayty.org:${{ env.PORTA }}/
          curl --fail --retry 5 --retry-delay 2 http://gr.lab.ayty.org:${{ env.PORTA }}/api/pokemons
