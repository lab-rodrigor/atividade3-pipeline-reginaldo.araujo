name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # TODO: troque pelo seu slug, o começo do seu e-mail com ponto virando hífen.
  SLUG: reginaldo-araujo
  # TODO: a primeira porta da sua faixa. Veja em `gr-docker ajuda`.
  PORTA: 23280

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker rm -f db api front || true"
          # TODO: apague os três containers, se existirem.
          # Dica: o passo não pode falhar quando eles ainda não existem.
          echo "TODO"

      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network create --internal net-db || true"
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network create net-api || true"
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker volume create pgdata || true"
          # TODO: as duas redes e o volume. A rede do banco é interna.
          # Dica: criar o que já existe devolve erro. Trate isso.
          echo "TODO"

      - name: Subir banco, API e front
        run: |
          # 1. Banco de Dados
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name db --network net-db -v pgdata:/var/lib/postgresql/data -e POSTGRES_PASSWORD='${{ secrets.DB_SENHA }}' postgres:15-alpine"

          # 2. API (Conectada à net-db e depois anexada à net-api)
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name api --network net-db -e DB_HOST=db -e DB_PASSWORD='${{ secrets.DB_SENHA }}' lab-rodrigor/atividade2-api"
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network connect net-api api"

          # 3. Front-end (Conectado à net-api e exposto na sua PORTA)
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name front --network net-api -p ${{ env.PORTA }}:80 -e DEPLOY_SHA=${{ github.sha }} lab-rodrigor/atividade2-front"
          # TODO: os três containers, na ordem certa.
          # O front precisa receber o commit que o deploy publicou:
          #   -e DEPLOY_SHA=${{ github.sha }}
          echo "TODO"

      - name: Conferir que subiu
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org "curl --fail --retry 5 --retry-delay 2 http://localhost:${{ env.PORTA }}/"
          # TODO: pergunte ao servidor se a listagem responde.
          echo "TODO"
